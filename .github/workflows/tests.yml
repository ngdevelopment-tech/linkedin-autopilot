name: Python and deployment checks
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python source
        run: python -m compileall -q bot.py replies.py storage.py message_policy.py
      - name: Check Railway entrypoint shell
        run: bash -n deploy/entrypoint.sh
      - name: Run offline tests
        run: python -m pytest -q
